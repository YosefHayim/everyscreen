<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hollis Goods</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; color: #1c1917; background: #faf7f2; }
  .header { padding: 16px; background: #fff; border-bottom: 1px solid #e7e0d5; }
  .header h1 { margin: 0; font-size: 20px; }
  .products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; }
  .product { background: #fff; border: 1px solid #e7e0d5; padding: 12px; }
  .label { width: 90px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .price { margin: 8px 0 0; }
  .buy { width: 100%; height: 48px; border: 0; background: #1c1917; color: #fff; }
  .cart-total { width: 480px; margin: 0 16px 16px; padding: 12px; background: #efe8da; }
  .checkout-bar { position: fixed; left: 0; right: 0; bottom: 0; height: 48px; border: 0; background: #b45309; color: #fff; }
  .small-button { width: 30px; height: 30px; margin: 0 16px 16px; }
</style>
</head>
<body>
  <div class="header"><h1>Hollis Goods</h1></div>
  <div class="products">
    <div class="product">
      <div class="label">Handwoven linen market tote</div>
      <p class="price">$48</p>
      <button type="button" class="buy">Buy</button>
    </div>
    <div class="product">
      <div class="name">Oak cutting board</div>
      <p class="price">$32</p>
      <button type="button" class="buy">Buy</button>
    </div>
  </div>
  <div class="cart-total">Cart total: $80.00 with free shipping on orders over $75</div>
  <button type="button" class="md:flex small-button" aria-label="Close">x</button>
  <button type="button" class="checkout-bar">Checkout</button>
  <script>
    console.error("Cart total failed to load");
    fetch("http://127.0.0.1:49151/api/cart").catch(() => {});
  </script>
</body>
</html>
